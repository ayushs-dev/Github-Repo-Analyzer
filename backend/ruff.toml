# Ruff is a very fast Python linter. A linter reads your code WITHOUT running it
# and flags mistakes — like a spell-checker for code.
#
# We only turn on the rules that catch real bugs, so CI fails for things that
# matter, not for style opinions:
#   E4, E7, E9 = syntax errors and clearly broken statements
#   F          = pyflakes: unused imports, undefined names, unused variables
# Style rules (import order, line length, ...) can be added later, one at a time.
target-version = "py311"
extend-exclude = ["venv"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Alembic's env.py intentionally imports the models AFTER its own setup code.
"alembic/env.py" = ["E402"]
